<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reading Archive — Interactive IELTS Practice</title>
<style>
:root {
  --bg: #f0efea;
  --card-bg: #fffdf6;
  --header: #1c3557;
  --accent: #2a7d6f;
  --accent-soft: #f0f9f7;
  --text: #222;
  --muted: #777;
  --border: #e0ddd5;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Georgia','Times New Roman',serif;color:var(--text);background:var(--bg);min-height:100vh;line-height:1.6}

header{background:var(--header);color:#fff;padding:38px 22px 34px;text-align:center}
header h1{font-size:1.7rem;font-weight:600;letter-spacing:.4px;margin-bottom:8px}
header p{font-size:.92rem;color:rgba(255,255,255,.78);max-width:560px;margin:0 auto;font-style:italic}

main{max-width:860px;margin:0 auto;padding:34px 22px 60px}

.toolbar{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-bottom:22px}
.count{font-size:.82rem;color:var(--muted)}
.count b{color:var(--accent);font-weight:700}
.search{flex:1;min-width:200px;max-width:320px;padding:9px 13px;border:1.5px solid var(--border);border-radius:8px;font-family:inherit;font-size:.86rem;background:#fff;color:var(--text)}
.search:focus{outline:none;border-color:var(--accent)}

.grid{display:grid;gap:14px}

.card{display:block;text-decoration:none;color:inherit;background:var(--card-bg);border:1px solid var(--border);border-radius:10px;padding:18px 20px;transition:border-color .15s,box-shadow .15s,transform .15s}
.card:hover{border-color:var(--accent);box-shadow:0 4px 14px rgba(0,0,0,.07);transform:translateY(-2px)}
.card-top{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin-bottom:9px}
.tag{font-size:.66rem;font-weight:700;letter-spacing:1.2px;text-transform:uppercase;color:#fff;background:var(--accent);padding:3px 9px;border-radius:11px}
.tag.book{background:var(--header)}
.meta{font-size:.74rem;color:var(--muted)}
.card h2{font-size:1.12rem;font-weight:600;color:var(--header);line-height:1.35;margin-bottom:5px}
.card .desc{font-size:.84rem;color:var(--muted)}
.card .go{display:inline-flex;align-items:center;gap:5px;margin-top:12px;font-size:.78rem;font-weight:700;color:var(--accent);text-transform:uppercase;letter-spacing:.6px}
.card .go::after{content:"→";font-size:.95rem}

.empty{text-align:center;color:var(--muted);font-style:italic;padding:40px 0;display:none}

footer{text-align:center;padding:26px 22px;font-size:.76rem;color:var(--muted);border-top:1px solid var(--border)}
footer a{color:var(--accent);text-decoration:none}
footer a:hover{text-decoration:underline}
</style>
</head>
<body>

<header>
  <h1>Reading Archive</h1>
  <p>A collection of interactive IELTS reading-practice passages — read, answer, and check yourself in the browser.</p>
</header>

<main>
  <div class="toolbar">
    <span class="count"><b id="shown">0</b> reading<span id="plural">s</span></span>
    <input type="search" id="search" class="search" placeholder="Search by title or book…" aria-label="Search readings">
  </div>

  <div class="grid" id="grid"></div>
  <p class="empty" id="empty">No readings match your search.</p>
</main>

<footer>
  Hosted on GitHub Pages ·
  <a href="https://github.com/Blue-cel/reading-archive">View source on GitHub</a>
</footer>

<script>
/* To add a new reading, drop the .html file in the repo and append an entry here. */
const READINGS = [
  {
    file: "writing-task1-line-graph-metals-guided.html",
    book: "Writing Task 1",
    title: "Line graph — Copper, nickel & zinc prices (guided practice)",
    desc: "12 practice steps · read the axes, write the overview, trends, data figures, comparison vocabulary, model answer",
    meta: "~25 min",
    type: "Writing"
  },
  {
    file: "writing-task1-bar-chart-waste-guided.html",
    book: "Writing Task 1",
    title: "Bar chart — Waste disposal in a European country (guided practice)",
    desc: "12 practice steps · read the bars, overview, trends, the 2008 crossover, grouping data, comparison vocabulary, model answer",
    meta: "~25 min",
    type: "Writing"
  },
  {
    file: "writing-task1-pie-chart-devices-guided.html",
    book: "Writing Task 1",
    title: "Pie charts — Smartphones vs tablets, by activity (guided practice)",
    desc: "12 practice steps · read proportions, overview, fraction vocabulary, comparing two charts, biggest contrasts, model answer",
    meta: "~25 min",
    type: "Writing"
  },
  {
    file: "writing-task1-table-underground-guided.html",
    book: "Writing Task 1",
    title: "Table — Underground railways in six cities (guided practice)",
    desc: "12 practice steps · read rows & columns, overview, superlatives, comparisons, length-vs-usage patterns, selecting key features, model answer",
    meta: "~25 min",
    type: "Writing"
  },
  {
    file: "writing-task-1-bee-life-cycle.html",
    book: "Writing Task 1",
    title: "Natural process — The Honey Bee Life Cycle (guided lesson)",
    desc: "21 practice steps · egg → nymph → adult, moulting, durations, intro, overview, sequencing, model answer",
    meta: "~30 min",
    type: "Writing"
  },
  {
    file: "writing-task-1-butterfly-life-cycle.html",
    book: "Writing Task 1",
    title: "Natural process — The Monarch Butterfly Life Cycle (guided lesson)",
    desc: "21 practice steps · four main stages, life-cycle vocabulary, durations, intro, overview, model answer",
    meta: "~30 min",
    type: "Writing"
  },
  {
    file: "writing-task-1-natural-process.html",
    book: "Writing Task 1",
    title: "Natural process — The Water Cycle (guided lesson)",
    desc: "20 practice steps · read the diagram, tense & voice, intro, overview, sequencing, model answer",
    meta: "~30 min",
    type: "Writing"
  },
  {
    file: "cam-18-1-1-interactive.html",
    book: "Cambridge IELTS 18",
    title: "Urban farming",
    desc: "Test 1 · Reading Passage 1 · Questions 1–13",
    meta: "~20 min"
  },
  {
    file: "cam-17-1-1-interactive.html",
    book: "Cambridge IELTS 17",
    title: "The development of the London underground railway",
    desc: "Test 1 · Reading Passage 1 · Questions 1–13",
    meta: "~20 min"
  },
  {
    file: "cam-16-test-2-passage-3-interactive.html",
    book: "Cambridge IELTS 16",
    title: "How to make wise decisions",
    desc: "Test 2 · Reading Passage 3 · Questions 27–40",
    meta: "~20 min"
  }
];

const grid = document.getElementById('grid');
const search = document.getElementById('search');
const shown = document.getElementById('shown');
const plural = document.getElementById('plural');
const empty = document.getElementById('empty');

function render(list){
  grid.innerHTML = list.map(r => `
    <a class="card" href="${r.file}">
      <div class="card-top">
        <span class="tag book">${r.book}</span>
        <span class="tag">${r.type || 'Reading'}</span>
        <span class="meta">${r.meta}</span>
      </div>
      <h2>${r.title}</h2>
      <div class="desc">${r.desc}</div>
      <span class="go">Open</span>
    </a>`).join('');
  shown.textContent = list.length;
  plural.style.display = list.length === 1 ? 'none' : 'inline';
  empty.style.display = list.length ? 'none' : 'block';
}

search.addEventListener('input', () => {
  const q = search.value.trim().toLowerCase();
  render(READINGS.filter(r =>
    (r.title + ' ' + r.book + ' ' + r.desc).toLowerCase().includes(q)
  ));
});

render(READINGS);
</script>

</body>
</html>
