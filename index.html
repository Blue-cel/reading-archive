<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IELTS Lab — Interactive Practice Archive</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Poppins:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#1E3A8A;
  --navy-deep:#14306E;
  --gold:#F5B82E;
  --gold-hover:#E0A21C;
  --blue:#2563EB;
  --blue-badge:#1D4ED8;
  --heading:#1E3A5F;
  --text:#374151;
  --muted:#6B7280;
  --border:#E5E7EB;
  --surface:#FFFFFF;
  --subtle:#F8FAFC;
  --tint:#EFF4FB;
  --bg:#F8FAFC;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',system-ui,-apple-system,sans-serif;color:var(--text);background:var(--bg);min-height:100vh;line-height:1.6}
h1,h2,.logo,.tab,.go{font-family:'Poppins','Inter',sans-serif}

/* Hero */
header.hero{background:var(--navy-deep);color:#fff;padding:34px 24px 38px;text-align:center}
header.hero h1{font-size:1.7rem;font-weight:600;letter-spacing:.3px;margin-bottom:8px}
header.hero p{font-size:.95rem;color:rgba(255,255,255,.8);max-width:560px;margin:0 auto}

main{max-width:920px;margin:0 auto;padding:28px 22px 60px}

/* Tab-bar filter */
.tabbar{display:flex;gap:4px;flex-wrap:wrap;border-bottom:1px solid var(--border);margin-bottom:18px}
.tab{appearance:none;border:none;background:none;cursor:pointer;font-size:.9rem;font-weight:500;color:var(--text);
  padding:11px 14px 12px;display:inline-flex;align-items:center;gap:8px;border-bottom:3px solid transparent;
  margin-bottom:-1px;transition:color .15s,border-color .15s}
.tab:hover{color:var(--blue)}
.tab .badge{font-size:.72rem;font-weight:600;background:var(--border);color:var(--muted);padding:2px 8px;border-radius:11px;transition:background .15s,color .15s}
.tab[aria-selected="true"]{color:var(--blue);font-weight:600;border-bottom-color:var(--blue)}
.tab[aria-selected="true"] .badge{background:var(--blue-badge);color:#fff}
.tab:focus-visible{outline:2px solid var(--blue);outline-offset:2px;border-radius:6px}

.toolbar{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-bottom:20px}
.count{font-size:.84rem;color:var(--muted)}
.count b{color:var(--blue);font-weight:600}
.search{flex:1;min-width:200px;max-width:320px;padding:10px 13px;border:1px solid var(--border);border-radius:9px;
  font-family:inherit;font-size:.88rem;background:#fff;color:var(--text)}
.search:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px rgba(37,99,235,.15)}

.grid{display:grid;gap:14px}

.card{display:block;text-decoration:none;color:inherit;background:var(--surface);border:1px solid var(--border);
  border-radius:12px;padding:18px 20px;transition:border-color .15s,box-shadow .15s,transform .15s}
.card:hover{border-color:var(--blue);box-shadow:0 4px 14px rgba(20,48,110,.08);transform:translateY(-2px)}
.card-top{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin-bottom:10px}
.tag{font-size:.66rem;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:#fff;background:var(--blue);padding:3px 9px;border-radius:11px}
.tag.book{background:var(--navy-deep)}
.meta{font-size:.76rem;color:var(--muted)}
.card h2{font-size:1.1rem;font-weight:600;color:var(--heading);line-height:1.35;margin-bottom:5px}
.card .desc{font-size:.86rem;color:var(--muted)}
.card .go{display:inline-flex;align-items:center;gap:5px;margin-top:12px;font-size:.76rem;font-weight:600;color:var(--blue);text-transform:uppercase;letter-spacing:.5px}
.card .go::after{content:"→";font-size:.95rem}

.empty{text-align:center;color:var(--muted);font-style:italic;padding:40px 0;display:none}

footer{text-align:center;padding:26px 22px;font-size:.78rem;color:var(--muted);border-top:1px solid var(--border)}
footer a{color:var(--blue);text-decoration:none}
footer a:hover{text-decoration:underline}
</style>
</head>
<body>

<header class="hero">
  <h1>Practice Archive</h1>
  <p>A collection of interactive IELTS practice materials — read, answer, and check yourself right in the browser.</p>
</header>

<main>
  <div class="tabbar" id="tabbar" role="tablist" aria-label="Filter by skill"></div>

  <div class="toolbar">
    <span class="count"><b id="shown">0</b> <span id="noun">item</span><span id="plural">s</span></span>
    <input type="search" id="search" class="search" placeholder="Search by title or book…" aria-label="Search materials">
  </div>

  <div class="grid" id="grid"></div>
  <p class="empty" id="empty">No materials match your search.</p>
</main>

<footer>
  Hosted on GitHub Pages ·
  <a href="https://github.com/Blue-cel/reading-archive">View source on GitHub</a>
</footer>

<script>
/* To add a new item, drop the .html file in the repo and append an entry here.
   `type` drives the skill filter — one of: Reading, Writing, Speaking, Listening, Grammar, Vocabulary. */
const READINGS = [
  {
    file: "writing-task1-line-graph-metals-guided.html",
    book: "Writing Task 1",
    title: "Line graph — Copper, nickel & zinc prices (guided practice)",
    desc: "12 practice steps · read the axes, write the overview, trends, data figures, comparison vocabulary, model answer",
    meta: "~25 min",
    type: "Writing"
  },
  {
    file: "writing-task1-bar-chart-waste-guided.html",
    book: "Writing Task 1",
    title: "Bar chart — Waste disposal in a European country (guided practice)",
    desc: "12 practice steps · read the bars, overview, trends, the 2008 crossover, grouping data, comparison vocabulary, model answer",
    meta: "~25 min",
    type: "Writing"
  },
  {
    file: "writing-task1-pie-chart-devices-guided.html",
    book: "Writing Task 1",
    title: "Pie charts — Smartphones vs tablets, by activity (guided practice)",
    desc: "12 practice steps · read proportions, overview, fraction vocabulary, comparing two charts, biggest contrasts, model answer",
    meta: "~25 min",
    type: "Writing"
  },
  {
    file: "writing-task1-table-underground-guided.html",
    book: "Writing Task 1",
    title: "Table — Underground railways in six cities (guided practice)",
    desc: "12 practice steps · read rows & columns, overview, superlatives, comparisons, length-vs-usage patterns, selecting key features, model answer",
    meta: "~25 min",
    type: "Writing"
  },
  {
    file: "writing-task1-mixed-charts-water-guided.html",
    book: "Writing Task 1",
    title: "Mixed charts — World water & water use (guided practice)",
    desc: "12 practice steps · two pies + a bar chart, all-chart overview, linking the pies, cross-country comparison, model answer",
    meta: "~25 min",
    type: "Writing"
  },
  {
    file: "writing-task1-mixed-pie-table-nationality-guided.html",
    book: "Writing Task 1",
    title: "Mixed — Population by nationality & where they live (guided practice)",
    desc: "12 practice steps · a pie + a table, all-chart overview, proportions, city-vs-countryside, linking the two charts, model answer",
    meta: "~25 min",
    type: "Writing"
  },
  {
    file: "writing-task-1-bee-life-cycle.html",
    book: "Writing Task 1",
    title: "Natural process — The Honey Bee Life Cycle (guided lesson)",
    desc: "21 practice steps · egg → nymph → adult, moulting, durations, intro, overview, sequencing, model answer",
    meta: "~30 min",
    type: "Writing"
  },
  {
    file: "writing-task-1-butterfly-life-cycle.html",
    book: "Writing Task 1",
    title: "Natural process — The Monarch Butterfly Life Cycle (guided lesson)",
    desc: "21 practice steps · four main stages, life-cycle vocabulary, durations, intro, overview, model answer",
    meta: "~30 min",
    type: "Writing"
  },
  {
    file: "writing-task-1-natural-process.html",
    book: "Writing Task 1",
    title: "Natural process — The Water Cycle (guided lesson)",
    desc: "20 practice steps · read the diagram, tense & voice, intro, overview, sequencing, model answer",
    meta: "~30 min",
    type: "Writing"
  },
  {
    file: "cam-18-1-1-interactive.html",
    book: "Cambridge IELTS 18",
    title: "Urban farming",
    desc: "Test 1 · Reading Passage 1 · Questions 1–13",
    meta: "~20 min",
    type: "Reading"
  },
  {
    file: "cam-17-1-1-interactive.html",
    book: "Cambridge IELTS 17",
    title: "The development of the London underground railway",
    desc: "Test 1 · Reading Passage 1 · Questions 1–13",
    meta: "~20 min",
    type: "Reading"
  },
  {
    file: "cam-16-test-2-passage-3-interactive.html",
    book: "Cambridge IELTS 16",
    title: "How to make wise decisions",
    desc: "Test 2 · Reading Passage 3 · Questions 27–40",
    meta: "~20 min",
    type: "Reading"
  }
];

const CATEGORIES = ["Reading","Writing","Speaking","Listening","Grammar","Vocabulary"];

const grid = document.getElementById('grid');
const search = document.getElementById('search');
const shown = document.getElementById('shown');
const noun = document.getElementById('noun');
const plural = document.getElementById('plural');
const empty = document.getElementById('empty');
const tabbar = document.getElementById('tabbar');

let activeCat = "All";

/* Build filter tabs: All + each skill, with live counts */
function buildTabs(){
  const cats = ["All", ...CATEGORIES];
  tabbar.innerHTML = cats.map(c => {
    const n = c === "All" ? READINGS.length : READINGS.filter(r => r.type === c).length;
    return `<button class="tab" role="tab" data-cat="${c}" aria-selected="${c===activeCat}">
      ${c}<span class="badge">${n}</span></button>`;
  }).join('');
  tabbar.querySelectorAll('.tab').forEach(t => {
    t.addEventListener('click', () => {
      activeCat = t.dataset.cat;
      tabbar.querySelectorAll('.tab').forEach(x => x.setAttribute('aria-selected', x === t));
      apply();
    });
  });
}

function render(list){
  grid.innerHTML = list.map(r => `
    <a class="card" href="${r.file}">
      <div class="card-top">
        <span class="tag book">${r.book}</span>
        <span class="tag">${r.type || 'Reading'}</span>
        <span class="meta">${r.meta}</span>
      </div>
      <h2>${r.title}</h2>
      <div class="desc">${r.desc}</div>
      <span class="go">Open</span>
    </a>`).join('');
  shown.textContent = list.length;
  noun.textContent = activeCat === "All" ? "item" : activeCat.toLowerCase() + " item";
  plural.style.display = list.length === 1 ? 'none' : 'inline';
  empty.style.display = list.length ? 'none' : 'block';
}

function apply(){
  const q = search.value.trim().toLowerCase();
  render(READINGS.filter(r =>
    (activeCat === "All" || r.type === activeCat) &&
    (r.title + ' ' + r.book + ' ' + r.desc).toLowerCase().includes(q)
  ));
}

search.addEventListener('input', apply);

buildTabs();
apply();
</script>

</body>
</html>
